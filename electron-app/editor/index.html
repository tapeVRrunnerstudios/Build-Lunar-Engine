<script id="engine-lunarscript">/*
 * LunarScript — the native scripting language of Lunar Engine.
 *
 * on start { ... }              runs once when the entity spawns
 * on update(dt) { ... }         runs every frame
 * on collision(other) { ... }   runs when this entity's collider hits another
 *
 * let x = 5;
 * fn add(a, b) { return a + b; }
 * if (self.x > 100) { self.x = 0; }
 * while (x < 10) { x = x + 1; }
 * for (let i = 0; i < 5; i = i + 1) { print(i); }
 *
 * Built-ins: self.*, input.key()/mouseDown()/mouseX/mouseY, time.dt/time.now,
 * math.*, print(), random(a,b), spawn(name), findByName(name), distance(a,b)
 *
 * This file has zero dependencies and runs in the browser or in Node.
 */
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.LunarScript = factory();
})(typeof self !== "undefined" ? self : this, function () {
"use strict";

// ---------------------------------------------------------------- LEXER ----
const KEYWORDS = new Set(["let","fn","if","else","while","for","on","return",
  "true","false","break","continue","null","and","or","not"]);

class Token {
  constructor(type, value, line) { this.type = type; this.value = value; this.line = line; }
}

class LunarSyntaxError extends Error {
  constructor(msg, line) { super(`LunarScript syntax error (line ${line}): ${msg}`); this.line = line; }
}

class LunarRuntimeError extends Error {
  constructor(msg, line) { super(`LunarScript runtime error${line ? " (line " + line + ")" : ""}: ${msg}`); this.line = line; }
}

function lex(src) {
  const tokens = [];
  let i = 0, line = 1;
  const n = src.length;
  const isDigit = c => c >= "0" && c <= "9";
  const isAlpha = c => /[A-Za-z_]/.test(c);
  const isAlnum = c => /[A-Za-z0-9_]/.test(c);

  while (i < n) {
    const c = src[i];
    if (c === "\n") { line++; i++; continue; }
    if (c === " " || c === "\t" || c === "\r") { i++; continue; }
    if (c === "/" && src[i + 1] === "/") { while (i < n && src[i] !== "\n") i++; continue; }
    if (c === "/" && src[i + 1] === "*") { i += 2; while (i < n && !(src[i] === "*" && src[i + 1] === "/")) { if (src[i] === "\n") line++; i++; } i += 2; continue; }

    if (c === '"' || c === "'") {
      const quote = c; let j = i + 1; let out = "";
      while (j < n && src[j] !== quote) {
        if (src[j] === "\\" && j + 1 < n) { const esc = src[j + 1]; out += esc === "n" ? "\n" : esc === "t" ? "\t" : esc; j += 2; }
        else { out += src[j]; j++; }
      }
      if (j >= n) throw new LunarSyntaxError("unterminated string", line);
      tokens.push(new Token("STRING", out, line));
      i = j + 1; continue;
    }

    if (isDigit(c) || (c === "." && isDigit(src[i + 1]))) {
      let j = i; while (j < n && (isDigit(src[j]) || src[j] === ".")) j++;
      tokens.push(new Token("NUMBER", parseFloat(src.slice(i, j)), line));
      i = j; continue;
    }

    if (isAlpha(c)) {
      let j = i; while (j < n && isAlnum(src[j])) j++;
      const word = src.slice(i, j);
      tokens.push(new Token(KEYWORDS.has(word) ? word.toUpperCase() : "IDENT", word, line));
      i = j; continue;
    }

    const two = src.slice(i, i + 2);
    if (["==", "!=", "<=", ">=", "&&", "||", "+=", "-=", "*=", "/="].includes(two)) {
      tokens.push(new Token(two, two, line)); i += 2; continue;
    }
    if ("+-*/%()=<>!{},;.".includes(c)) { tokens.push(new Token(c, c, line)); i++; continue; }

    throw new LunarSyntaxError(`unexpected character '${c}'`, line);
  }
  tokens.push(new Token("EOF", null, line));
  return tokens;
}

// --------------------------------------------------------------- PARSER ----
// AST node shape: { kind, ...fields, line }
class Parser {
  constructor(tokens) { this.toks = tokens; this.pos = 0; }
  peek(o = 0) { return this.toks[this.pos + o]; }
  at(...types) { return types.includes(this.peek().type); }
  advance() { return this.toks[this.pos++]; }
  expect(type, msg) {
    if (!this.at(type)) throw new LunarSyntaxError(msg || `expected '${type}' but got '${this.peek().type}'`, this.peek().line);
    return this.advance();
  }

  parseProgram() {
    const events = [], functions = [], globals = [];
    while (!this.at("EOF")) {
      if (this.at("ON")) events.push(this.parseEvent());
      else if (this.at("FN")) functions.push(this.parseFunc());
      else globals.push(this.parseStatement());
    }
    return { kind: "Program", events, functions, globals };
  }

  parseEvent() {
    const line = this.advance().line; // 'on'
    const name = this.expect("IDENT", "expected event name after 'on'").value;
    const params = [];
    if (this.at("(")) {
      this.advance();
      while (!this.at(")")) { params.push(this.expect("IDENT").value); if (this.at(",")) this.advance(); }
      this.advance();
    }
    const body = this.parseBlock();
    return { kind: "Event", name, params, body, line };
  }

  parseFunc() {
    const line = this.advance().line; // 'fn'
    const name = this.expect("IDENT", "expected function name").value;
    this.expect("(");
    const params = [];
    while (!this.at(")")) { params.push(this.expect("IDENT").value); if (this.at(",")) this.advance(); }
    this.advance();
    const body = this.parseBlock();
    return { kind: "Func", name, params, body, line };
  }

  parseBlock() {
    this.expect("{");
    const stmts = [];
    while (!this.at("}")) stmts.push(this.parseStatement());
    this.expect("}");
    return { kind: "Block", stmts };
  }

  parseStatement() {
    if (this.at("LET")) return this.parseLet();
    if (this.at("IF")) return this.parseIf();
    if (this.at("WHILE")) return this.parseWhile();
    if (this.at("FOR")) return this.parseFor();
    if (this.at("RETURN")) { const line = this.advance().line; const arg = this.at(";") ? null : this.parseExpr(); this.expect(";"); return { kind: "Return", arg, line }; }
    if (this.at("BREAK")) { const line = this.advance().line; this.expect(";"); return { kind: "Break", line }; }
    if (this.at("CONTINUE")) { const line = this.advance().line; this.expect(";"); return { kind: "Continue", line }; }
    if (this.at("{")) return this.parseBlock();
    const line = this.peek().line;
    const expr = this.parseExpr();
    this.expect(";", "expected ';' after expression");
    return { kind: "ExprStmt", expr, line };
  }

  parseLet() {
    const line = this.advance().line;
    const name = this.expect("IDENT").value;
    let init = null;
    if (this.at("=")) { this.advance(); init = this.parseExpr(); }
    this.expect(";");
    return { kind: "Let", name, init, line };
  }

  parseIf() {
    const line = this.advance().line;
    this.expect("(");
    const cond = this.parseExpr();
    this.expect(")");
    const then = this.parseBlock();
    let elseBranch = null;
    if (this.at("ELSE")) { this.advance(); elseBranch = this.at("IF") ? this.parseIf() : this.parseBlock(); }
    return { kind: "If", cond, then, elseBranch, line };
  }

  parseWhile() {
    const line = this.advance().line;
    this.expect("(");
    const cond = this.parseExpr();
    this.expect(")");
    const body = this.parseBlock();
    return { kind: "While", cond, body, line };
  }

  parseFor() {
    const line = this.advance().line;
    this.expect("(");
    const init = this.at(";") ? null : (this.at("LET") ? this.parseLet() : (() => { const e = { kind: "ExprStmt", expr: this.parseExpr(), line }; this.expect(";"); return e; })());
    if (!init) this.expect(";");
    const cond = this.at(";") ? { kind: "Bool", value: true } : this.parseExpr();
    this.expect(";");
    const update = this.at(")") ? null : this.parseExpr();
    this.expect(")");
    const body = this.parseBlock();
    return { kind: "For", init, cond, update, body, line };
  }

  // expr precedence: assignment > or > and > equality > comparison > term > factor > unary > call > primary
  parseExpr() { return this.parseAssignment(); }

  parseAssignment() {
    const line = this.peek().line;
    const left = this.parseOr();
    if (this.at("=", "+=", "-=", "*=", "/=")) {
      const op = this.advance().type;
      const value = this.parseAssignment();
      if (left.kind !== "Ident" && left.kind !== "Member") throw new LunarSyntaxError("invalid assignment target", line);
      return { kind: "Assign", op, target: left, value, line };
    }
    return left;
  }

  parseOr() { let l = this.parseAnd(); while (this.at("||", "OR")) { const line = this.advance().line; l = { kind: "Logical", op: "||", left: l, right: this.parseAnd(), line }; } return l; }
  parseAnd() { let l = this.parseEquality(); while (this.at("&&", "AND")) { const line = this.advance().line; l = { kind: "Logical", op: "&&", left: l, right: this.parseEquality(), line }; } return l; }
  parseEquality() { let l = this.parseComparison(); while (this.at("==", "!=")) { const op = this.advance().type; l = { kind: "Binary", op, left: l, right: this.parseComparison() }; } return l; }
  parseComparison() { let l = this.parseTerm(); while (this.at("<", ">", "<=", ">=")) { const op = this.advance().type; l = { kind: "Binary", op, left: l, right: this.parseTerm() }; } return l; }
  parseTerm() { let l = this.parseFactor(); while (this.at("+", "-")) { const op = this.advance().type; l = { kind: "Binary", op, left: l, right: this.parseFactor() }; } return l; }
  parseFactor() { let l = this.parseUnary(); while (this.at("*", "/", "%")) { const op = this.advance().type; l = { kind: "Binary", op, left: l, right: this.parseUnary() }; } return l; }

  parseUnary() {
    if (this.at("!", "NOT") || (this.at("-"))) {
      const op = this.advance().type;
      return { kind: "Unary", op: (op === "NOT" ? "!" : op), arg: this.parseUnary() };
    }
    return this.parseCall();
  }

  parseCall() {
    let expr = this.parsePrimary();
    for (;;) {
      if (this.at("(")) {
        this.advance();
        const args = [];
        while (!this.at(")")) { args.push(this.parseExpr()); if (this.at(",")) this.advance(); }
        this.advance();
        expr = { kind: "Call", callee: expr, args };
      } else if (this.at(".")) {
        this.advance();
        const name = this.expect("IDENT").value;
        expr = { kind: "Member", object: expr, prop: name };
      } else break;
    }
    return expr;
  }

  parsePrimary() {
    const t = this.peek();
    if (this.at("NUMBER")) { this.advance(); return { kind: "Number", value: t.value }; }
    if (this.at("STRING")) { this.advance(); return { kind: "String", value: t.value }; }
    if (this.at("TRUE")) { this.advance(); return { kind: "Bool", value: true }; }
    if (this.at("FALSE")) { this.advance(); return { kind: "Bool", value: false }; }
    if (this.at("NULL")) { this.advance(); return { kind: "Null" }; }
    if (this.at("IDENT")) { this.advance(); return { kind: "Ident", name: t.value }; }
    if (this.at("(")) { this.advance(); const e = this.parseExpr(); this.expect(")"); return e; }
    throw new LunarSyntaxError(`unexpected token '${t.type}'`, t.line);
  }
}

function parse(src) { return new Parser(lex(src)).parseProgram(); }

// ------------------------------------------------------------ INTERPRETER --
class Environment {
  constructor(parent = null) { this.vars = new Map(); this.parent = parent; }
  declare(name, value) { this.vars.set(name, value); }
  has(name) { return this.vars.has(name) || (this.parent && this.parent.has(name)); }
  get(name) {
    if (this.vars.has(name)) return this.vars.get(name);
    if (this.parent) return this.parent.get(name);
    throw new LunarRuntimeError(`undefined variable '${name}'`);
  }
  set(name, value) {
    if (this.vars.has(name)) { this.vars.set(name, value); return; }
    if (this.parent) return this.parent.set(name, value);
    // implicit global declaration, forgiving for beginners
    this.vars.set(name, value);
  }
}

const BREAK = Symbol("break"), CONTINUE = Symbol("continue");
class ReturnSignal { constructor(value) { this.value = value; } }

class LunarFunction {
  constructor(decl, closure) { this.decl = decl; this.closure = closure; }
  call(interp, args) {
    const env = new Environment(this.closure);
    this.decl.params.forEach((p, i) => env.declare(p, args[i] !== undefined ? args[i] : null));
    const result = interp.execBlock(this.decl.body, env);
    return result instanceof ReturnSignal ? result.value : null;
  }
}

class Program {
  constructor(source, host) {
    this.ast = parse(source);
    this.host = host || {};
    this.globals = new Environment();
    this.globals.declare("self", this.host.self || {});
    this.globals.declare("input", this.host.input || {});
    this.globals.declare("time", this.host.time || {});
    this.globals.declare("math", Object.assign({ PI: Math.PI, abs: Math.abs, floor: Math.floor, ceil: Math.ceil,
      round: Math.round, sqrt: Math.sqrt, sin: Math.sin, cos: Math.cos, min: Math.min, max: Math.max,
      clamp: (v, a, b) => Math.min(b, Math.max(a, v)) }, this.host.math || {}));
    this.globals.declare("print", (...a) => (this.host.print || console.log)(...a));
    this.globals.declare("random", (a, b) => a + Math.random() * (b - a));
    this.globals.declare("distance", (a, b) => Math.hypot((a.x || 0) - (b.x || 0), (a.y || 0) - (b.y || 0)));
    this.globals.declare("spawn", (name) => (this.host.spawn ? this.host.spawn(name) : null));
    this.globals.declare("findByName", (name) => (this.host.findByName ? this.host.findByName(name) : null));
    this.functions = new Map();
    for (const fn of this.ast.functions) this.functions.set(fn.name, new LunarFunction(fn, this.globals));
    for (const [name, fn] of this.functions) this.globals.declare(name, (...args) => fn.call(this, args));
    this.events = new Map();
    for (const ev of this.ast.events) this.events.set(ev.name, ev);
    for (const stmt of this.ast.globals) this.execStatement(stmt, this.globals);
  }

  trigger(eventName, args = []) {
    const ev = this.events.get(eventName);
    if (!ev) return;
    const env = new Environment(this.globals);
    ev.params.forEach((p, i) => env.declare(p, args[i] !== undefined ? args[i] : null));
    this.execBlock(ev.body, env);
  }

  hasEvent(name) { return this.events.has(name); }

  execBlock(block, env) {
    for (const stmt of block.stmts) {
      const sig = this.execStatement(stmt, env);
      if (sig === BREAK || sig === CONTINUE || sig instanceof ReturnSignal) return sig;
    }
    return null;
  }

  execStatement(stmt, env) {
    switch (stmt.kind) {
      case "Let": env.declare(stmt.name, stmt.init ? this.evalExpr(stmt.init, env) : null); return null;
      case "ExprStmt": this.evalExpr(stmt.expr, env); return null;
      case "Block": { const inner = new Environment(env); return this.execBlock(stmt, inner); }
      case "If": {
        if (this.truthy(this.evalExpr(stmt.cond, env))) return this.execBlock(stmt.then, new Environment(env));
        if (stmt.elseBranch) return stmt.elseBranch.kind === "If" ? this.execStatement(stmt.elseBranch, env) : this.execBlock(stmt.elseBranch, new Environment(env));
        return null;
      }
      case "While": {
        let guard = 0;
        while (this.truthy(this.evalExpr(stmt.cond, env))) {
          if (++guard > 2_000_000) throw new LunarRuntimeError("possible infinite loop in while", stmt.line);
          const sig = this.execBlock(stmt.body, new Environment(env));
          if (sig === BREAK) break;
          if (sig instanceof ReturnSignal) return sig;
        }
        return null;
      }
      case "For": {
        const scope = new Environment(env);
        if (stmt.init) this.execStatement(stmt.init, scope);
        let guard = 0;
        while (this.truthy(this.evalExpr(stmt.cond, scope))) {
          if (++guard > 2_000_000) throw new LunarRuntimeError("possible infinite loop in for", stmt.line);
          const sig = this.execBlock(stmt.body, new Environment(scope));
          if (sig === BREAK) break;
          if (sig instanceof ReturnSignal) return sig;
          if (stmt.update) this.evalExpr(stmt.update, scope);
        }

<script id="engine-blueprint">/*
 * Lunar Blueprints — visual node-graph scripting, the no-code alternative
 * to LunarScript. Same host API (self/input/time/math/spawn/etc), same
 * events (Start/Update/Collision), different authoring surface.
 *
 * Graph shape:
 * {
 *   nodes: [ { id, type, x, y, data: {...} } ],
 *   links: [ { from: nodeId, fromPort: name, to: nodeId, toPort: name, kind: "exec"|"data" } ]

// Each node type declares: category, execIn/execOut (booleans), dataIn (named list),
// dataOut (named list), and either exec(ctx,node,inputs) for action/flow nodes
// or eval(ctx,node,inputs) for pure value nodes.

  // ---- Events (graph entry points, exec-out only) ----
  "Event/OnStart":     { category: "event", event: "start", execOut: ["out"] },
  "Event/OnUpdate":    { category: "event", event: "update", execOut: ["out"], dataOut: ["dt"] },
  "Event/OnCollision": { category: "event", event: "collision", execOut: ["out"], dataOut: ["other"] },

  "Flow/If": {
    category: "flow", execIn: true, execOut: ["true", "false"], dataIn: ["cond"],
    exec(ctx, node, inp) { return inp.cond ? "true" : "false"; }
  },
  "Flow/Sequence": {
    category: "flow", execIn: true, execOut: ["1", "2", "3"],
    exec(ctx, node, inp, run) { run("1"); run("2"); run("3"); return null; }
  },

  // ---- Actions (side effects on self / world) ----
  "Action/MoveBy": {
    category: "action", execIn: true, execOut: ["out"], dataIn: ["dx", "dy"],
    exec(ctx) { return "out"; },
    apply(ctx, inp) { ctx.self.x += (inp.dx || 0); ctx.self.y += (inp.dy || 0); }
  },
  "Action/SetVelocity": {
    category: "action", execIn: true, execOut: ["out"], dataIn: ["vx", "vy"],
    apply(ctx, inp) { ctx.self.velX = inp.vx || 0; ctx.self.velY = inp.vy || 0; }
  },
  "Action/Print": {
    category: "action", execIn: true, execOut: ["out"], dataIn: ["value"],
    apply(ctx, inp) { (ctx.print || console.log)(String(inp.value)); }
  },
  "Action/DestroySelf": {

    apply(ctx) { if (ctx.destroySelf) ctx.destroySelf(); }
  },
  "Action/PlayAnimation": {

    apply(ctx, inp) { if (ctx.playAnimation) ctx.playAnimation(inp.name); }
  },
  "Action/Spawn": {

    apply(ctx, inp) { if (ctx.spawn) ctx.spawn(inp.name); }

  "Value/String":     { category: "value", dataOut: ["value"], eval: (ctx, node) => String(node.data.value || "") },
  "Value/Bool":       { category: "value", dataOut: ["value"], eval: (ctx, node) => !!node.data.value },
  "Value/SelfX":      { category: "value", dataOut: ["value"], eval: (ctx) => ctx.self.x },
  "Value/SelfY":      { category: "value", dataOut: ["value"], eval: (ctx) => ctx.self.y },
  "Value/KeyDown":    { category: "value", dataIn: ["key"], dataOut: ["value"], eval: (ctx, node, inp) => !!(ctx.input && ctx.input.key(inp.key || node.data.key)) },

  constructor(graphData, host) {

    }

  }

  evalData(nodeId, port, ctx, depthGuard = 0) {
    if (depthGuard > 500) throw new Error("Blueprint: data cycle detected");
    const link = this.findDataLink(nodeId, port);
    const node = this.nodes.get(nodeId);

      return node && node.data ? node.data[port] : undefined;
    }
    const srcNode = this.nodes.get(link.from);
    if (!srcNode) return undefined;
    return this.resolveNodeOutput(srcNode, link.fromPort, ctx, depthGuard);
  }

  runExec(nodeId, ctx, guard = { n: 0 }) {
    if (!nodeId) return;
    if (++guard.n > 100000) throw new Error("Blueprint: possible infinite loop");
    const node = this.nodes.get(nodeId);
    if (!node) return;
    const def = BP_NODE_DEFS[node.type];
    if (!def) return;
    const inputs = {};
    for (const p of def.dataIn || []) inputs[p] = this.evalData(node.id, p, ctx);
    if (def.apply) def.apply(ctx, inputs, node);
    let outPort = "out";
    if (def.exec) outPort = def.exec(ctx, node, inputs, (port) => {
      for (const link of this.findExecLinks(node.id, port)) this.runExec(link.to, ctx, guard);
    }) || null;
    if (outPort) for (const link of this.findExecLinks(node.id, outPort)) this.runExec(link.to, ctx, guard);
  }

    for (const node of this.nodes.values()) {
      const def = BP_NODE_DEFS[node.type];
      if (def && def.category === "event" && def.event === eventName) {

      }
    }
  }
}

<script id="engine-core">/*
 * Lunar Engine — core (rendering-agnostic; canvas rendering lives in the editor shell).
 * Real ECS: Entities hold Components, Systems act on the Scene each frame.

function lerp(a, b, t) { return a + (b - a) * t; }

    <div class="hint">Events: <b>on start { }</b>, <b>on update(dt) { }</b>, <b>on collision(other) { }</b>. API: self.x/y/rot/scaleX/scaleY/velX/velY/color/visible/width/height/name/tag/active, self.destroy(), self.playAnimation(name), input.key("ArrowRight"), time.dt, math.*, print(...), random(a,b), spawn(name), findByName(name).</div>
    <textarea id="codeSrc" class="codeBox" spellcheck="false">${esc(script.source)}</textarea>
    <div id="codeStatus" class="hint"></div>
    <div style="text-align:right;margin-top:8px"><button id="closeCode">Close</button> <button id="testCode">Test Compile</button> <button id="saveCode" class="active">Save</button></div>
  </div></div>`;
  const box = document.getElementById("codeSrc"), status = document.getElementById("codeStatus");
  function test() {
    try {
      const fakeSelf = { x: 0, y: 0, rot: 0, scaleX: 1, scaleY: 1, velX: 0, velY: 0, color: "#fff", visible: true, width: 1, height: 1, name: entity.name, tag: entity.tag, active: true, destroy() {}, playAnimation() {} };
      const prog = LunarScript.compile(box.value, { self: fakeSelf, input: { key: () => false }, print: () => {} });
      const events = ["start", "update", "collision"].filter(n => prog.hasEvent(n));
      status.innerHTML = `<span style="color:#7fe0a8">✓ Compiles OK</span> — events found: ${events.join(", ") || "none"}`;
    } catch (err) { status.innerHTML = `<span class="errText">✗ ${esc(err.message)}</span>`; }
  }
  document.getElementById("testCode").onclick = test;
  document.getElementById("saveCode").onclick = () => { script.source = box.value; script._compiled = null; script._error = null; log("Saved LunarScript for " + entity.name); test(); refresh(); };
  document.getElementById("closeCode").onclick = closeModal;

}

// ------------------------------------------------------ BLUEPRINT EDITOR ---
function openBlueprintEditor(entity, script) {
  const graph = script.graph = script.graph || { nodes: [], links: [] };
  const defs = LunarBlueprint.BP_NODE_DEFS;
  const cam = { x: 0, y: 0, zoom: 1 };
  let selectedNode = null, selectedLink = null, dragNode = null, dragPan = null, dragLink = null, nextNodeId = 1;

  document.getElementById("modal").innerHTML = `<div class="modal"><div class="box wide">
    <h2>Blueprints — ${esc(entity.name)}</h2>
    <div class="bpWrap">
      <div class="bpPalette" id="bpPalette"></div>
      <div class="bpCanvasWrap"><canvas id="bpCanvas"></canvas></div>
      <div class="bpInspector" id="bpInspector"><div class="hint">Click a node to edit its fields. Drag from an output dot to an input dot to connect. Select a node or link and press Delete to remove it.</div></div>
    </div>
    <div style="text-align:right;margin-top:8px"><button id="closeBp">Close</button> <button id="saveBp" class="active">Save</button></div>
  </div></div>`;

  const palette = document.getElementById("bpPalette");
  const groups = { event: "Events", flow: "Flow", action: "Actions", value: "Values" };
  let paletteHtml = "";
  for (const cat of Object.keys(groups)) {
    paletteHtml += `<div class="cat">${groups[cat]}</div>`;
    for (const type of Object.keys(defs)) if (defs[type].category === cat) paletteHtml += `<button data-add="${type}">${type.split("/")[1]}</button>`;
  }
  palette.innerHTML = paletteHtml;

  const cv = document.getElementById("bpCanvas"), ctx = cv.getContext("2d");
  function resizeCanvas() { const rect = cv.parentElement.getBoundingClientRect(); const d = devicePixelRatio || 1; cv.width = rect.width * d; cv.height = rect.height * d; ctx.setTransform(d, 0, 0, d, 0, 0); cv.style.width = rect.width + "px"; cv.style.height = rect.height + "px"; cv._w = rect.width; cv._h = rect.height; draw(); }

  function portsOf(node) {
    const def = defs[node.type]; if (!def) return { inputs: [], outputs: [] };
    const inputs = []; if (def.execIn) inputs.push({ name: "in", kind: "exec" }); for (const p of def.dataIn || []) inputs.push({ name: p, kind: "data" });
    const outputs = []; for (const p of def.execOut || []) outputs.push({ name: p, kind: "exec" }); for (const p of def.dataOut || []) outputs.push({ name: p, kind: "data" });
    return { inputs, outputs };
  }
  function nodeSize(node) { const { inputs, outputs } = portsOf(node); const rows = Math.max(inputs.length, outputs.length, 1); return { w: 150, h: 26 + rows * 18 + 6 }; }
  function toScreen(x, y) { return { x: (x + cam.x) * cam.zoom, y: (y + cam.y) * cam.zoom }; }
  function toWorld(x, y) { return { x: x / cam.zoom - cam.x, y: y / cam.zoom - cam.y }; }
  function portPos(node, index, side) { const { w, h } = nodeSize(node); const { inputs, outputs } = portsOf(node); const list = side === "in" ? inputs : outputs; const rowH = (h - 26) / Math.max(1, list.length); const py = node.y + 26 + rowH * index + rowH / 2; const px = side === "in" ? node.x : node.x + w; return toScreen(px, py); }

  function draw() {
    ctx.clearRect(0, 0, cv._w, cv._h);
    ctx.fillStyle = "#0b0d11"; ctx.fillRect(0, 0, cv._w, cv._h);
    // links
    for (const link of graph.links) {
      const fn = graph.nodes.find(n => n.id === link.from), tn = graph.nodes.find(n => n.id === link.to);
      if (!fn || !tn) continue;
      const fp = portsOf(fn), tp = portsOf(tn);
      const fi = fp.outputs.findIndex(p => p.name === link.fromPort), ti = tp.inputs.findIndex(p => p.name === link.toPort);
      if (fi < 0 || ti < 0) continue;
      const a = portPos(fn, fi, "out"), b = portPos(tn, ti, "in");
      ctx.strokeStyle = link === selectedLink ? "#ffffff" : (link.kind === "exec" ? "#e5c96a" : "#7fbfff");
      ctx.lineWidth = link === selectedLink ? 3 : 2;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.bezierCurveTo(a.x + 40, a.y, b.x - 40, b.y, b.x, b.y); ctx.stroke();
    }
    if (dragLink) {
      ctx.strokeStyle = "#aaa"; ctx.lineWidth = 2; ctx.setLineDash([4, 3]);
      ctx.beginPath(); ctx.moveTo(dragLink.from.x, dragLink.from.y); ctx.lineTo(dragLink.to.x, dragLink.to.y); ctx.stroke(); ctx.setLineDash([]);
    }
    // nodes
    for (const node of graph.nodes) {
      const { w, h } = nodeSize(node); const p = toScreen(node.x, node.y);
      const def = defs[node.type] || {};
      const catColor = { event: "#8a5cff", flow: "#c98a3a", action: "#3aa06e", value: "#3a7fc9" }[def.category] || "#555";
      ctx.fillStyle = "#171a20"; ctx.strokeStyle = node === selectedNode ? "#ffffff" : "#363c49"; ctx.lineWidth = node === selectedNode ? 2 : 1;
      ctx.beginPath(); ctx.roundRect(p.x, p.y, w * cam.zoom, h * cam.zoom, 6); ctx.fill(); ctx.stroke();
      ctx.fillStyle = catColor; ctx.beginPath(); ctx.roundRect(p.x, p.y, w * cam.zoom, 20 * cam.zoom, 6); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.font = `${11 * cam.zoom}px Segoe UI`; ctx.fillText(node.type.split("/")[1], p.x + 6, p.y + 14 * cam.zoom);
      const { inputs, outputs } = portsOf(node);
      inputs.forEach((port, i) => { const pp = portPos(node, i, "in"); ctx.fillStyle = port.kind === "exec" ? "#e5c96a" : "#7fbfff"; ctx.beginPath(); ctx.arc(pp.x, pp.y, 4, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = "#ccc"; ctx.font = `${9 * cam.zoom}px Segoe UI`; ctx.fillText(port.name, pp.x + 7, pp.y + 3); });
      outputs.forEach((port, i) => { const pp = portPos(node, i, "out"); ctx.fillStyle = port.kind === "exec" ? "#e5c96a" : "#7fbfff"; ctx.beginPath(); ctx.arc(pp.x, pp.y, 4, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = "#ccc"; ctx.font = `${9 * cam.zoom}px Segoe UI`; const tw = ctx.measureText(port.name).width; ctx.fillText(port.name, pp.x - 7 - tw, pp.y + 3); });
    }
  }

  function hitNode(wx, wy) {
    for (let i = graph.nodes.length - 1; i >= 0; i--) { const n = graph.nodes[i]; const { w, h } = nodeSize(n); if (wx >= n.x && wx <= n.x + w && wy >= n.y && wy <= n.y + h) return n; }
    return null;
  }
  function hitPort(sx, sy) {
    const R = 7;
    for (const node of graph.nodes) {
      const { inputs, outputs } = portsOf(node);
      for (let i = 0; i < inputs.length; i++) { const p = portPos(node, i, "in"); if (Math.hypot(p.x - sx, p.y - sy) < R) return { node, index: i, side: "in", port: inputs[i] }; }
      for (let i = 0; i < outputs.length; i++) { const p = portPos(node, i, "out"); if (Math.hypot(p.x - sx, p.y - sy) < R) return { node, index: i, side: "out", port: outputs[i] }; }
    }
    return null;
  }
  function hitLink(sx, sy) {
    for (const link of graph.links) {
      const fn = graph.nodes.find(n => n.id === link.from), tn = graph.nodes.find(n => n.id === link.to); if (!fn || !tn) continue;
      const fp = portsOf(fn), tp = portsOf(tn);
      const fi = fp.outputs.findIndex(p => p.name === link.fromPort), ti = tp.inputs.findIndex(p => p.name === link.toPort); if (fi < 0 || ti < 0) continue;
      const a = portPos(fn, fi, "out"), b = portPos(tn, ti, "in");
      for (let t = 0; t <= 1; t += 0.05) { const x = a.x + (b.x - a.x) * t, y = a.y + (b.y - a.y) * t; if (Math.hypot(x - sx, y - sy) < 6) return link; }
    }
    return null;
  }

  function renderInspector() {
    const box = document.getElementById("bpInspector");
    if (!selectedNode) { box.innerHTML = '<div class="hint">Click a node to edit its fields. Drag from an output dot to an input dot to connect. Select a node or link and press Delete to remove it.</div>'; return; }
    const node = selectedNode, def = defs[node.type] || {};
    let html = `<div class="hint"><b>${esc(node.type)}</b></div>`;
    if (node.type === "Value/Compare") html += field("Operator", `<select data-bp="op">${["==", "!=", "<", ">", "<=", ">="].map(o => `<option ${node.data.op === o ? "selected" : ""}>${o}</option>`).join("")}</select>`);
    if (node.type === "Value/Math") html += field("Operator", `<select data-bp="op">${["+", "-", "*", "/"].map(o => `<option ${node.data.op === o ? "selected" : ""}>${o}</option>`).join("")}</select>`);
    if (node.type === "Value/Bool") html += `<label class="check"><input type="checkbox" data-bp="value" ${node.data.value ? "checked" : ""}> value</label>`;
    for (const p of def.dataIn || []) { if (node.type === "Value/Compare" && p === "op") continue; html += field(p, `<input data-bp="${p}" value="${esc(node.data[p] ?? "")}">`); }
    html += `<button id="deleteNode" class="danger" style="width:100%;margin-top:8px">Delete Node</button>`;
    box.innerHTML = html;
    box.querySelectorAll("[data-bp]").forEach(el => el.onchange = () => { const key = el.dataset.bp; node.data[key] = el.type === "checkbox" ? el.checked : el.value; draw(); });
    document.getElementById("deleteNode").onclick = () => { graph.nodes = graph.nodes.filter(n => n !== node); graph.links = graph.links.filter(l => l.from !== node.id && l.to !== node.id); selectedNode = null; renderInspector(); draw(); };
  }

  palette.querySelectorAll("[data-add]").forEach(btn => btn.onclick = () => {
    const type = btn.dataset.add;
    graph.nodes.push({ id: "n" + (nextNodeId++) + "_" + Date.now().toString(36), type, x: 40 - cam.x + 20, y: 40 - cam.y + 20, data: {} });
    draw();
  });

  cv.addEventListener("contextmenu", e => e.preventDefault());
  cv.addEventListener("wheel", e => { e.preventDefault(); const rect = cv.getBoundingClientRect(); cam.zoom = Math.max(0.4, Math.min(2, cam.zoom * (e.deltaY > 0 ? 0.9 : 1.1))); draw(); });
  cv.addEventListener("pointerdown", e => {
    const rect = cv.getBoundingClientRect(); const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    const port = hitPort(sx, sy);
    if (port && port.side === "out") { dragLink = { fromNode: port.node, fromPort: port.port.name, kind: port.port.kind, from: { x: sx, y: sy }, to: { x: sx, y: sy } }; return; }
    if (port && port.side === "in") {
      const existing = graph.links.find(l => l.to === port.node.id && l.toPort === port.port.name);
      if (existing) { const fn = graph.nodes.find(n => n.id === existing.from); const fi = portsOf(fn).outputs.findIndex(p => p.name === existing.fromPort); const fp = portPos(fn, fi, "out"); graph.links = graph.links.filter(l => l !== existing); dragLink = { fromNode: fn, fromPort: existing.fromPort, kind: existing.kind, from: fp, to: { x: sx, y: sy } }; }
      return;
    }
    const world = toWorld(sx, sy); const node = hitNode(world.x, world.y);
    if (node) { selectedNode = node; selectedLink = null; dragNode = { node, offX: world.x - node.x, offY: world.y - node.y }; renderInspector(); draw(); return; }
    const link = hitLink(sx, sy);
    if (link) { selectedLink = link; selectedNode = null; renderInspector(); draw(); return; }
    selectedNode = null; selectedLink = null; renderInspector(); dragPan = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y }; draw();
  });
  cv.addEventListener("pointermove", e => {
    const rect = cv.getBoundingClientRect(); const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    if (dragLink) { dragLink.to = { x: sx, y: sy }; draw(); return; }
    if (dragNode) { const world = toWorld(sx, sy); dragNode.node.x = world.x - dragNode.offX; dragNode.node.y = world.y - dragNode.offY; draw(); return; }
    if (dragPan) { cam.x = dragPan.cx + (e.clientX - dragPan.x) / cam.zoom; cam.y = dragPan.cy + (e.clientY - dragPan.y) / cam.zoom; draw(); }
  });
  addEventListener("pointerup", e => {
    if (dragLink) {
      const rect = cv.getBoundingClientRect(); const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
      const target = hitPort(sx, sy);
      if (target && target.side === "in" && target.port.kind === dragLink.kind && target.node !== dragLink.fromNode) {
        graph.links = graph.links.filter(l => !(l.to === target.node.id && l.toPort === target.port.name));
        graph.links.push({ kind: dragLink.kind, from: dragLink.fromNode.id, fromPort: dragLink.fromPort, to: target.node.id, toPort: target.port.name });
      }
      dragLink = null; draw();
    }
    dragNode = null; dragPan = null;
  });
  document.addEventListener("keydown", function delKey(e) {
    if (!document.getElementById("bpCanvas")) { document.removeEventListener("keydown", delKey); return; }
    if (e.key === "Delete" || e.key === "Backspace") {
      if (document.activeElement && ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) return;
      if (selectedNode) { graph.nodes = graph.nodes.filter(n => n !== selectedNode); graph.links = graph.links.filter(l => l.from !== selectedNode.id && l.to !== selectedNode.id); selectedNode = null; renderInspector(); draw(); }
      else if (selectedLink) { graph.links = graph.links.filter(l => l !== selectedLink); selectedLink = null; draw(); }
    }
  });

  document.getElementById("saveBp").onclick = () => { script.graph = graph; script._compiled = null; script._error = null; log("Saved Blueprint for " + entity.name); refresh(); };
  document.getElementById("closeBp").onclick = closeModal;
  requestAnimationFrame(() => { resizeCanvas(); });
  window.addEventListener("resize", resizeCanvas);
}

// ------------------------------------------------------------ INSPECTOR ----
function inspect() {
  const box = document.getElementById("inspector"), e = state.selected;
  if (!e) { box.innerHTML = '<div class="hint">Select an entity.</div>'; return; }
  const t = e.transform, s = e.get(Engine.SpriteRenderer), rb = e.get(Engine.Rigidbody2D), c = e.get(Engine.BoxCollider2D), p = e.get(Engine.ParticleEmitter), script = e.get(Engine.ScriptComponent);
  const parentOptions = `<option value="">None (Root)</option>` + state.editScene.entities.filter(x => x !== e && !isDescendant(x, e)).map(x => `<option value="${x.id}" ${e.parent === x ? "selected" : ""}>${esc(x.name)}</option>`).join("");
  let h = `<div class="section"><div class="head">GameObject</div>${field("Name", `<input data-p="name" value="${esc(e.name)}">`)}${field("Tag", `<input data-p="tag" value="${esc(e.tag)}">`)}${field("Parent", `<select data-p="parent">${parentOptions}</select>`)}<label class="check"><input type="checkbox" data-p="active" ${e.active ? "checked" : ""}> Active</label></div>`;
  h += `<div class="section"><div class="head">Transform</div>${field("Position", `<div class="xy"><input data-p="px" value="${t.position.x}"><input data-p="py" value="${t.position.y}"></div>`)}${field("Rotation", `<input data-p="rot" value="${t.rotation * 180 / Math.PI}">`)}${field("Scale", `<div class="xy"><input data-p="sx" value="${t.scale.x}"><input data-p="sy" value="${t.scale.y}"></div>`)}</div>`;
  if (s) h += `<div class="section"><div class="head">Sprite Renderer</div>${field("Sprite", `<div><b>${esc(s.imageName || "None")}</b><br><button id="inspectorSprite">Choose / Upload</button></div>`)}${field("Color", `<input type="color" data-p="color" value="${s.color}">`)}${field("Width", `<input type="number" data-p="width" value="${s.width}">`)}${field("Height", `<input type="number" data-p="height" value="${s.height}">`)}${field("Shape", `<select data-p="shape"><option ${s.shape === "box" ? "selected" : ""}>box</option><option ${s.shape === "circle" ? "selected" : ""}>circle</option></select>`)}</div>`;
  if (rb) h += `<div class="section"><div class="head">Rigidbody 2D</div>${field("Body Type", `<select data-p="bodyType"><option ${rb.bodyType === "Dynamic" ? "selected" : ""}>Dynamic</option><option ${rb.bodyType === "Static" ? "selected" : ""}>Static</option><option ${rb.bodyType === "Kinematic" ? "selected" : ""}>Kinematic</option></select>`)}${field("Gravity", `<input type="number" step=".1" data-p="gravityScale" value="${rb.gravityScale}">`)}<label class="check"><input type="checkbox" data-p="useGravity" ${rb.useGravity ? "checked" : ""}> Use Gravity</label></div>`;
  if (c) h += `<div class="section"><div class="head">Box Collider 2D</div>${field("Size", `<div class="xy"><input data-p="cx" value="${c.size.x}"><input data-p="cy" value="${c.size.y}"></div>`)}<label class="check"><input type="checkbox" data-p="trigger" ${c.isTrigger ? "checked" : ""}> Is Trigger</label></div>`;
  if (p) h += `<div class="section"><div class="head">Particle Emitter</div>${field("Rate", `<input type="number" data-p="rate" value="${p.rate}">`)}${field("Lifetime", `<input type="number" data-p="life" value="${p.life}">`)}${field("Speed", `<input type="number" data-p="speed" value="${p.speed}">`)}</div>`;
  const an = e.get(Engine.Animator);
  if (an) { const clips = Object.keys(an.clips); h += `<div class="section"><div class="head">Animator</div>${field("Clip", `<select data-p="animClip">${clips.map(n => `<option ${n === an.current ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>`)}<label class="check"><input type="checkbox" data-p="animPlaying" ${an.playing ? "checked" : ""}> Playing</label><button id="editAnim" style="width:100%">Open Animation Editor</button></div>`; }
  if (script) {
    h += `<div class="section"><div class="head">Script<span style="font-weight:400;color:#8a91a3">${script._error ? " ⚠" : ""}</span></div>`
      + field("Language", `<select data-p="scriptLang"><option value="lunarscript" ${script.language === "lunarscript" ? "selected" : ""}>LunarScript</option><option value="blueprint" ${script.language === "blueprint" ? "selected" : ""}>Blueprints</option></select>`)
      + `<label class="check"><input type="checkbox" data-p="scriptEnabled" ${script.enabled ? "checked" : ""}> Enabled</label>`
      + `<button id="openScriptEditor" style="width:100%">${script.language === "blueprint" ? "Open Blueprint Editor" : "Open Code Editor"}</button>`
      + (script._error ? `<div class="errText">${esc(script._error)}</div>` : "")
      + `<button id="removeScript" class="danger" style="width:100%;margin-top:4px">Remove Script</button></div>`;
  }
  h += `<button id="add" style="width:100%">＋ Add Component</button><button id="delete" class="danger" style="width:100%;margin-top:6px">Delete GameObject</button>`;
  box.innerHTML = h;
  box.querySelectorAll("input,select").forEach(x => x.onchange = () => apply(x));
  const sb = document.getElementById("inspectorSprite"); if (sb) sb.onclick = () => document.getElementById("spriteFile").click();
  const ea = document.getElementById("editAnim"); if (ea) ea.onclick = openAnimator;
  const os = document.getElementById("openScriptEditor"); if (os) os.onclick = () => script.language === "blueprint" ? openBlueprintEditor(e, script) : openCodeEditor(e, script);
  const rs = document.getElementById("removeScript"); if (rs) rs.onclick = () => { e.remove(script); log("Removed script from " + e.name); refresh(); };
  document.getElementById("add").onclick = addComponent;
  document.getElementById("delete").onclick = () => { state.editScene.entities = state.editScene.entities.filter(x => x !== e); state.selected = state.editScene.entities[0] || null; log("Deleted " + e.name, "warn"); refresh(); };
}
function apply(x) {
  const e = state.selected; if (!e) return;
  const v = x.type === "checkbox" ? x.checked : (x.type === "number" ? +x.value : x.value);
  const d = x.dataset.p;
  if (d === "name" || d === "tag" || d === "active") e[d] = v;
  else if (d === "parent") { const par = v ? state.editScene.find(+v) : null; if (par && isDescendant(par, e)) return; addChild(e, par); }
  else if (d === "animClip") { const a = e.get(Engine.Animator); if (a) a.current = v; }
  else if (d === "animPlaying") { const a = e.get(Engine.Animator); if (a) a.playing = v; }
  else if (d === "px" || d === "py") e.transform.position[d === "px" ? "x" : "y"] = +v;
  else if (d === "rot") e.transform.rotation = (+v) * Math.PI / 180;
  else if (d === "sx" || d === "sy") e.transform.scale[d === "sx" ? "x" : "y"] = +v;
  else if (["color", "width", "height", "shape"].includes(d)) { const s = e.get(Engine.SpriteRenderer); if (s) s[d] = v; }
  else if (["bodyType", "gravityScale", "useGravity"].includes(d)) { const b = e.get(Engine.Rigidbody2D); if (b) b[d] = v; }
  else if (["cx", "cy", "trigger"].includes(d)) { const c = e.get(Engine.BoxCollider2D); if (c) { if (d === "cx") c.size.x = +v; if (d === "cy") c.size.y = +v; if (d === "trigger") c.isTrigger = v; } }
  else if (["rate", "life", "speed"].includes(d)) { const p = e.get(Engine.ParticleEmitter); if (p) p[d] = +v; }
  else if (d === "scriptLang") { const sc = e.get(Engine.ScriptComponent); if (sc) sc.language = v; }
  else if (d === "scriptEnabled") { const sc = e.get(Engine.ScriptComponent); if (sc) sc.enabled = v; }
  refresh();
}
function addComponent() {
  const e = state.selected; if (!e) return;
  const opts = ["Rigidbody 2D", "Box Collider 2D", "Particle Emitter", "Animator", "Script"];
  document.getElementById("modal").innerHTML = `<div class="modal"><div class="box"><h2>Add Component</h2>${opts.map(o => `<button class="choice" data-c="${o}" style="display:block;width:100%;margin:5px 0">${o}</button>`).join("")}<button onclick="closeModal()" style="margin-top:8px">Close</button></div></div>`;
  document.querySelectorAll(".choice").forEach(b => b.onclick = () => {

  let hit = null;
  for (const en of [...state.editScene.entities].reverse()) {
    const s = en.get(Engine.SpriteRenderer); if (!s || !s.visible) continue;
    const p = r.screen(en.transform.position);
    if (Math.abs(mx - p.x) < s.width * r.zoom / 2 && Math.abs(my - p.y) < s.height * r.zoom / 2) { hit = en; break; }
  }

  refresh();
});

function loop(now) {

<script>// Runs only inside the Electron editor window (window.lunarDesktop is injected
// by preload.js). In a plain browser tab this script no-ops and the editor
// behaves exactly like the standalone version (download/upload .lunagame files).
(function () {
  if (!window.lunarDesktop) return;

  let projectPath = null;

  document.getElementById("new").textContent = "☰ Hub";
  document.getElementById("new").onclick = () => window.lunarDesktop.focusHub();
  document.getElementById("load").style.display = "none";
  document.getElementById("build").textContent = "💾 Export Game";

  window.save = async function () {
    if (!projectPath) { log("No project file open yet.", "err"); return; }
    const data = projectData();
    const res = await window.lunarDesktop.saveProject(projectPath, data, state.projectName, state.projectLanguage);
    if (res && res.ok) log("Saved " + projectPath);
    else log("Save failed.", "err");
  };
  document.getElementById("save").onclick = save;

  window.buildGamePackage = async function () {
    log("Exporting standalone game…");
    const runtime = exportedRuntime();
    const res = await window.lunarDesktop.exportGame(state.projectName, runtime);
    if (res && res.ok) log("Exported playable game to " + res.path + " — open it in any browser, or package it with Electron/nexe for a real .exe.");
    else log("Export canceled.");
  };
  document.getElementById("build").onclick = buildGamePackage;

  (async () => {
    const ctx = await window.lunarDesktop.getContext();
    projectPath = ctx && ctx.path;
    if (!projectPath) { log("No project file associated with this window.", "err"); return; }
    const res = await window.lunarDesktop.loadProject(projectPath);
    if (res && res.ok) {
      try { loadProjectData(res.data); log("Opened " + projectPath); }
      catch (err) { log("Failed to open project: " + err.message, "err"); }
    } else {
      log("Could not read project file.", "err");
    }
  })();
})();
</script>
